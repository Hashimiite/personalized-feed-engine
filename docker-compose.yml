services:
  api:
    build: .
    image: personalized-feed-engine
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-feed}:${DB_PASSWORD:-feed}@db:5432/${DB_NAME:-feed}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-feed}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-feed}
      POSTGRES_DB: ${DB_NAME:-feed}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
