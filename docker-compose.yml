services:
  api:
    build: .
    image: personalized-feed-engine
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-feed}:${DB_PASSWORD:-feed}@db:5432/${DB_NAME:-feed}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # Optional: any LangChain chat model, e.g. openai:gpt-4o-mini or anthropic:claude-haiku-4-5-20251001,
      # plus that provider's API key. Compose reads both from .env.
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USER:-feed}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-feed}
      POSTGRES_DB: ${DB_NAME:-feed}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
