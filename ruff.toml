target-version = "py313"
line-length = 110

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
# FastAPI's Depends() in argument defaults is the framework's documented pattern
ignore = ["B008"]

[lint.per-file-ignores]
# Integration tests skip at import time when Postgres/Redis aren't configured
"tests/test_api.py" = ["E402"]
