name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: feed
          POSTGRES_PASSWORD: feed
          POSTGRES_DB: feed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feed -d feed"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://feed:feed@localhost:5432/feed
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: .models
          key: fastembed-bge-small-en-v1.5
      - run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: personalized-feed-engine:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the full stack
        run: |
          docker compose up -d --wait
          docker compose exec -T api python seed.py
          curl -sf localhost:8000/health
          curl -sf localhost:8000/feed/1 | python3 -c 'import sys, json; d = json.load(sys.stdin); assert d["data"], d'
          curl -sf -X POST localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question": "Did interest rates change?"}' \
            | python3 -c 'import sys, json; d = json.load(sys.stdin); assert all(p["topic"] == "finance" for p in d["posts"]) and d["posts"], d'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
